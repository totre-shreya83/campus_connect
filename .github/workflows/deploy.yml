name: CampusConnect CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: campusconnect_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Wait for MySQL
        run: |
          python - <<'PY'
          import socket
          import time

          host = "127.0.0.1"
          port = 3306

          for attempt in range(30):
              try:
                  with socket.create_connection((host, port), timeout=2):
                      print("MySQL is ready.")
                      break
              except OSError:
                  print(f"Waiting for MySQL... attempt {attempt + 1}/30")
                  time.sleep(2)
          else:
              raise RuntimeError("MySQL did not become ready.")
          PY

      - name: Run tests
        env:
          DATABASE_URL: mysql+pymysql://root:testpass@127.0.0.1:3306/campusconnect_test
          SECRET_KEY: ci-test-secret-key
          AWS_REGION: ap-south-1
          S3_BUCKET_NAME: campusconnect-ci-test
        run: |
          python -m pytest -v

  deploy:
    name: Deploy to EC2
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/campusconnect
            chmod +x deploy/post_deploy.sh
            ./deploy/post_deploy.sh
